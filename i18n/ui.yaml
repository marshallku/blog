# UI string catalog for template localization.
#
# Structure: <language-code> -> <key> -> <string>. The default language must
# define every key; other supported languages must define the same keys (the
# build fails otherwise, so an English page never silently falls back to Korean).
# `{...}` placeholders are substituted in templates (e.g. {n}, {name}, {category}).

ko:
    reading_time: "{n}분 읽기"
    reading_time_short: "{n}분"
    last_modified: "최종 수정일"
    share: "공유하기"
    share_on: "{name}에 공유"
    copy_link: "링크 복사"
    related_in_category: "{category} 카테고리 관련 글"
    related_prompt: "위 글이 유용하셨다면, 아래 글도 읽어보세요!"
    table_of_contents: "목차"
    previous_post: "이전 글"
    next_post: "다음 글"
    scroll_top: "맨 위로 스크롤"
    toggle_theme: "테마 토글"
    # Listings
    all: "전체"
    category_posts_heading: "{category} 카테고리 글"
    tag_posts_heading: "{tag} 태그 글"
    post_count: "총 {n}개"
    more_in_category: "{category} 카테고리 글 더 보기"
    all_tags: "모든 태그"
    # Comment form
    reply_prefix: ""
    reply_suffix: " 님에게 답글"
    reply_suffix_page: "님에게 답글"
    comment_cancel: "취소"
    comment_name: "이름"
    comment_website: "웹사이트"
    comment_website_optional: "website (optional)"
    comment_avatar_alt: "내 아바타"
    comment_body_placeholder: "메시지를 입력하세요…  (⌘/Ctrl + Enter 전송)"
    comment_body_placeholder_page: "댓글을 입력해 주세요. 작성한 댓글은 수정하거나 삭제할 수 없습니다."
    comment_submit: "댓글 남기기"
    comment_immutable_notice: "작성한 댓글은 수정하거나 삭제할 수 없습니다"
    comment_loading: "댓글을 불러오는 중..."

